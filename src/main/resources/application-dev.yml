spring:
  datasource:
    url: jdbc:mysql://localhost:3306/fitness_center_db
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

#Flyway becomes responsible for schema changes.
#  Flyway = database structure authority
  #Hibernate = database mapping/validation

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

  sql:
    init:
      mode: never

logging:
  level:
    root: INFO
    com.fitnesscenter: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

#JWT config
app:
  jwt:
    secret: ${JWT_SECRET:3BGLMUCggki1Q4aLMbMclUpa95BY7dU0Mxhl8pOgYKKGmacVRFAhex1yyr4xyCYNiaT6UXdWQkkTqK0rGePhNy}
    access-token-expiration: 900000
