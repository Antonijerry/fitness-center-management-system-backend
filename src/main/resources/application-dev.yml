spring:
  datasource:
    url: jdbc:mysql://localhost:3306/fitness_center_db
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

logging:
  level:
    root: INFO
    com.fitnesscenter: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG